  NO SETUP NEEDED — just copy and paste each section.

  HOW TO ADD A SECTION IN GHL:
  ─────────────────────────────
  1. Open your page in GHL's page builder
  2. Add a "Custom HTML" element where you want the section
  3. Open the matching file below in VS Code
  4. Select All (Ctrl+A) → Copy (Ctrl+C)
  5. Paste into GHL's Custom HTML editor
  6. Save & preview

  SECTION ORDER:
  ──────────────
  01-hero.html          → Hero + Navbar (mobile menu included)
  02-services.html      → Service Cards (hover effects included)
  03-reviews.html       → Google Reviews Grid
  04-about.html         → About / Story + Stats
  05-service-area.html  → Miami-Dade & Broward Cities
  06-estimate-form.html → Free Estimate Form  ⚠️ See note below
  07-footer.html        → Footer

  ⚠️  ESTIMATE FORM (06-estimate-form.html):
  The form is fully styled but needs to be connected to GHL
  to actually capture leads into your CRM. Choose one:

    Option A — Replace the <form> tag block with your GHL
               embedded form snippet (keeps all the surrounding
               layout and styling intact)

    Option B — Add your GHL webhook URL to the form's action:
               <form action="YOUR_WEBHOOK_URL" method="POST">

    Option C — Use GHL's native "Form" element for that section
               and skip pasting this file
